name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip .[dev]

      - name: Run unit tests
        run: python -m pytest -m "not integration" -v

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install ".[dev]"
      - name: Build sdist and wheel
        run: python -m build
      - name: Import the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/cvmdata-wheel"
          "$RUNNER_TEMP/cvmdata-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cvmdata-wheel/bin/python" -c "from importlib.metadata import version; import cvmdata; assert version('cvmdata') == cvmdata.__version__; assert all(hasattr(cvmdata, name) for name in cvmdata.__all__)"
